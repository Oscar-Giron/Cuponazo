<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width,initial-scale=1.0"> 
    <title>Administrador - Gestión de Cupones</title>
    <link rel="stylesheet" href="administrador.css">
</head> 
<body> 
    <header> 
        <div class="logo">Cuponazo Admin</div>
        <input type="text" placeholder="🔍 Buscar Producto..." id="inputBuscador"> 
    </header> 
    
    <main> 
        <div class="main-header">
            <h1>Gestión de Productos</h1> 
            <button class="btn btn-add" onclick="AdCupon()">+ Añadir Producto</button> 
        </div>

        <div class="table-container">
            <table> 
                <thead> 
                    <tr> 
                        <th>ID</th> 
                        <th>Nombre</th> 
                        <th>Categoría</th> 
                        <th>Precio</th> 
                        <th>Stock</th> 
                        <th>Acciones</th> 
                    </tr> 
                </thead> 
                <tbody id="tablaProductos"> 
                    </tbody> 
            </table> 
        </div>
    </main> 

    <div id="modalProducto" class="modal"> 
        <div class="modal-content"> 
            <h2 id="tituloModal">Añadir Nuevo Producto</h2> 
            
            <div class="form-group">
                <label>ID:</label>
                <input type="text" id="p_id" placeholder="001">
            </div>

            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="p_nombre">
            </div>

            <div class="form-group">
                <label>Categoría:</label>
                <select id="p_categoria">
                    <option value="">Seleccione una categoría</option>
                    <option value="1">Deportes</option>
                    <option value="2">Bienestar</option>
                    <option value="3">Ocio</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Precio:</label>
                    <input type="number" id="p_precio" step="0.01">
                </div>
                <div class="form-group">
                    <label>Stock:</label>
                    <input type="number" id="p_stock">
                </div>
            </div>

            <div class="modal-actions"> 
                <button class="btn btn-save" onclick="GuardarProducto()">Guardar</button> 
                <button class="btn btn-cancel" onclick="cerrarModal()">Cancelar</button> 
            </div> 
        </div> 
    </div> 

    <script src="administrador.js"></script> 
</body> 
</html>
