<!DOCTYPE html> 

<html lang="es"> 

<head> 

    <meta charset="UTF-8"> 

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <title>Mi página</title> 

</head> 

<body> 
    <header> 
         <!--falta poner imagen--> 
        <img href="../logo.png"> 
        <span>🛒</span> 
    <p>Nombre de Usuario</p> 
   <input placeholder="Busqueda"><span>🔍</span> 
    </header> 
<!--Copiar barra lateral--> 
<h1>Mi carrito</h1> 
<div id="carrito"> 
    <!--Aqui va el script para que cuando añadamos productos, se añadan al carrito--> 
<script> 
    function mostrarCarrito() { 
  const carrito = JSON.parse(localStorage.getItem("carrito")) || []; 
  const contenedor = document.getElementById("carrito"); 
  carrito.forEach(producto => { 
    const item = document.createElement("p"); 
    item.textContent = `${producto.nombre} - ${producto.precio}€`; 
    contenedor.appendChild(item); 
  }); 

}
// Ejecutar al cargar la página 
mostrarCarrito(); 
</script> 
<p>Total: <!--Calcular la suma total del script anterior--></p> 
</div> 
<!--Cuando hagamos click tiene que ir a la pagina de pagos--> 
<button>Pagar</button> 
</body> 
</html>
